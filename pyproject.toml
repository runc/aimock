[project]
name = "cae-report-server-v2"
version = "0.1.0"
description = "CAE 仿真报告智能体 mock 服务集（server-v2）：SDM 任务信息 / 压缩包解析校验 / Word 生成 / 模板结构化信息 / 标准持久化"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "rarfile>=4.2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[tool.uv]
package = false
